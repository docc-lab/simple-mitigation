# Example CEL policy driving the HarvestContainers (hc) actuator.
# Use as POLICY_CONFIG (the file the controller watches), not as a ConfigMap.
#
# Preconditions on the victim's node (see
# HarvestContainers-docclab-mod/Docs/07_icelake_hc_actuator_plan.md):
#   - qidlecpu.ko loaded and hc-listener.service running (127.0.0.1:10101)
#   - the controller runs as root on the host (systemd-run, /proc/idlecpu,
#     sched_setaffinity on host TIDs)
#   - the victim is pinned (taskset CPU_SET) -- its cores are derived from
#     Cpus_allowed_list unless victim_cpulist is given
rules:
  - name: extrinsic_tail_contention
    # Fire on the victim's p90 tail score.
    when: "tail_now > 0.35"
    fire:
      - kind: hc
        params:
          aggressor_selector: "gordion-aggr=true"
          aggressor_namespace: "*"
          secondary_cpulist: "5-8"     # aggressors' dedicated cores (sm110p, nosmt)
          target_idle_cores: 1         # must be < number of victim cores
          acbf: 0.33                   # LOWIDLEFREQ_THRESHOLD
          low_tic: 1
          balancer_cpu: 14
    cooldown: "5s"
    priority: 100

  - name: clean_state
    when: "tail_now < 0.2 && p50_now < 0.2"
    fire:
      - kind: restore            # fans out to hc.Restore (and every other actuator)
        params:
          tier: all
    cooldown: "30s"
    priority: 10
